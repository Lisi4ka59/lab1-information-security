name: dependency-check
on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
jobs:
  depcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: OWASP Dependency-Check (docker)
        run: |
          mkdir -p reports
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            owasp/dependency-check:latest \
            --project "${{ github.repository }}" \
            --scan /src \
            --format HTML \
            --out /src/reports \
            --failOnCVSS 7 \
            --enableRetired \
            --nvdApiKey "${{ secrets.NVD_API_KEY }}" \
            --ossIndexUsername "${{ secrets.OSSINDEX_USER }}" \
            --ossIndexPassword "${{ secrets.OSSINDEX_TOKEN }}" || true

      - name: Save HTML report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: src/reports/dependency-check-report.html
